server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  # The page and its ES modules must never be cached independently: a browser
  # holding one old module beside new ones throws during init and the login
  # form stops working. These files are a few KB on an intranet, so always
  # revalidate. Declared at server level because a nested add_header would
  # drop the security headers above.
  add_header Cache-Control "no-cache" always;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # The portal root prefers an administrator-uploaded login page when one is
  # active and falls back to the built-in page. Every security header is repeated
  # here because a nested add_header replaces the server-level set; the only
  # relaxation is style-src, so an uploaded page may carry its own CSS while
  # scripts stay forbidden on the origin that holds the session cookie.
  location = / {
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-cache" always;
    try_files /custom/index.html /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

}
