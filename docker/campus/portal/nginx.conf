server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  # The page and its ES modules must never be cached independently: a browser
  # holding one old module beside new ones throws during init and the login
  # form stops working. These files are a few KB on an intranet, so always
  # revalidate. Declared at server level because a nested add_header would
  # drop the security headers above.
  add_header Cache-Control "no-cache" always;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

}
