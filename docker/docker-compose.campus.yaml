name: njit-campus

x-campus-dify-build: &campus-dify-build
  context: ..
  dockerfile: api/Dockerfile.campus
  args:
    DIFY_API_BASE_IMAGE: ${CAMPUS_DIFY_API_BASE_IMAGE:-langgenius/dify-api@sha256:bd3e8b15cfc47e89dc7a0d17431e6f3289244f4b442b96e2372bd0f0646f3d58}

x-campus-dify-image: &campus-dify-image njit/dify-api-campus:${CAMPUS_IMAGE_TAG:-dev}
x-campus-dify-web-image: &campus-dify-web-image njit/dify-web-campus:${CAMPUS_WEB_IMAGE_TAG:-dev}

x-campus-runtime-env: &campus-runtime-env
    CAMPUS_ENABLED: ${CAMPUS_ENABLED:-true}
    CAMPUS_VIRTUAL_IDENTITY_ENABLED: ${CAMPUS_VIRTUAL_IDENTITY_ENABLED:-false}
    CAMPUS_VIRTUAL_IDENTITIES_JSON: ${CAMPUS_VIRTUAL_IDENTITIES_JSON:-}
    CAMPUS_BOOTSTRAP_ADMIN_ACCOUNT_IDS: ${CAMPUS_BOOTSTRAP_ADMIN_ACCOUNT_IDS:-}
    CAMPUS_SERVICE_PRINCIPAL_EMAIL: ${CAMPUS_SERVICE_PRINCIPAL_EMAIL:?set CAMPUS_SERVICE_PRINCIPAL_EMAIL}
    CAMPUS_DEFAULT_ALLOWANCE_USD: ${CAMPUS_DEFAULT_ALLOWANCE_USD:-10}
    CAMPUS_RESERVATION_CAPACITY: ${CAMPUS_RESERVATION_CAPACITY:-500}
    CAMPUS_BOOKING_DAYS: ${CAMPUS_BOOKING_DAYS:-7}
    CAMPUS_CURRENT_SLOT_MAX_LOAD_PER_CPU: ${CAMPUS_CURRENT_SLOT_MAX_LOAD_PER_CPU:-1.0}
    CAMPUS_KNOWLEDGE_MAX_DATASETS_PER_WORKSPACE: ${CAMPUS_KNOWLEDGE_MAX_DATASETS_PER_WORKSPACE:-1}
    CAMPUS_KNOWLEDGE_MAX_DOCUMENTS_PER_DATASET: ${CAMPUS_KNOWLEDGE_MAX_DOCUMENTS_PER_DATASET:-5}
    CAMPUS_AUDIO_MAX_DURATION_SECONDS: ${CAMPUS_AUDIO_MAX_DURATION_SECONDS:-60}
    CAMPUS_PORTAL_LOGIN_STORAGE_DIR: ${CAMPUS_PORTAL_LOGIN_STORAGE_DIR:-/app/api/storage/campus-portal-login}
    CAMPUS_PORTAL_SESSION_TTL_HOURS: ${CAMPUS_PORTAL_SESSION_TTL_HOURS:-12}
    CAMPUS_PORTAL_COOKIE_NAME: ${CAMPUS_PORTAL_COOKIE_NAME:-campus_portal_session}
    CAMPUS_PORTAL_COOKIE_SECURE: ${CAMPUS_PORTAL_COOKIE_SECURE:-true}
    CAMPUS_MANUAL_PUBLIC_PORT: ${CAMPUS_MANUAL_PUBLIC_PORT:-18083}
    CAMPUS_NEWAPI_BASE_URL: http://model-gateway:3000
    CAMPUS_NEWAPI_ADMIN_ACCESS_TOKEN: ${CAMPUS_NEWAPI_ADMIN_ACCESS_TOKEN:?set CAMPUS_NEWAPI_ADMIN_ACCESS_TOKEN}
    CAMPUS_NEWAPI_ADMIN_USER_ID: ${CAMPUS_NEWAPI_ADMIN_USER_ID:-1}
    CAMPUS_NEWAPI_GROUP: ${CAMPUS_NEWAPI_GROUP:-campus}
    CAMPUS_NEWAPI_MODEL_LIMITS: ${CAMPUS_NEWAPI_MODEL_LIMITS:-}
    CAMPUS_NEWAPI_QUOTA_UNITS_PER_USD: ${CAMPUS_NEWAPI_QUOTA_UNITS_PER_USD:-500000}
    CAMPUS_MODEL_PROVIDER: ${CAMPUS_MODEL_PROVIDER:-langgenius/openai_api_compatible/openai_api_compatible}
    CAMPUS_MODEL_PROVIDER_PLUGIN_UNIQUE_IDENTIFIER: ${CAMPUS_MODEL_PROVIDER_PLUGIN_UNIQUE_IDENTIFIER:?set CAMPUS_MODEL_PROVIDER_PLUGIN_UNIQUE_IDENTIFIER}
    CAMPUS_MODEL_PROVIDER_CREDENTIAL_NAME: ${CAMPUS_MODEL_PROVIDER_CREDENTIAL_NAME:-Campus managed}
    CAMPUS_MODEL_PROVIDER_CREDENTIAL_SCOPE: ${CAMPUS_MODEL_PROVIDER_CREDENTIAL_SCOPE:-model}
    CAMPUS_MODEL_PROVIDER_API_KEY_FIELD: ${CAMPUS_MODEL_PROVIDER_API_KEY_FIELD:-api_key}
    CAMPUS_MODEL_PROVIDER_BASE_URL_FIELD: ${CAMPUS_MODEL_PROVIDER_BASE_URL_FIELD:-endpoint_url}
    CAMPUS_MODEL_PROVIDER_BASE_URL: http://model-gateway:3000/v1
    CAMPUS_MODEL_PROVIDER_MODELS: ${CAMPUS_MODEL_PROVIDER_MODELS:-llm:deepseek-v4-flash,llm:deepseek-v4-flash-0817,llm:glm-5.3-flash,text-embedding:bge-m3,rerank:bge-reranker-v2-m3}
    CAMPUS_MODEL_PROVIDER_API_PROTOCOL: ${CAMPUS_MODEL_PROVIDER_API_PROTOCOL:-chat}
    CAMPUS_MODEL_PROVIDER_VISION_MODELS: ${CAMPUS_MODEL_PROVIDER_VISION_MODELS:-}
    CAMPUS_MODEL_PROVIDER_AUDIO_MODELS: ${CAMPUS_MODEL_PROVIDER_AUDIO_MODELS:-}
    CAMPUS_MODEL_PROVIDER_DOCUMENT_MODELS: ${CAMPUS_MODEL_PROVIDER_DOCUMENT_MODELS:-}

services:
  api:
    image: *campus-dify-image
    build: *campus-dify-build
    environment:
      <<: *campus-runtime-env
      CODE_EXECUTION_API_KEY: ${SANDBOX_API_KEY:?set SANDBOX_API_KEY}
      SERVER_WORKER_AMOUNT: ${CAMPUS_API_WORKER_AMOUNT:-4}
      SERVER_WORKER_CLASS: ${CAMPUS_API_WORKER_CLASS:-gevent}
      SERVER_WORKER_CONNECTIONS: ${CAMPUS_API_WORKER_CONNECTIONS:-200}
      SQLALCHEMY_POOL_SIZE: ${CAMPUS_DB_POOL_SIZE:-20}
      SQLALCHEMY_MAX_OVERFLOW: ${CAMPUS_DB_MAX_OVERFLOW:-10}
      MARKETPLACE_ENABLED: ${MARKETPLACE_ENABLED:-false}
    volumes:
      # Shared with the portal container: the API writes uploaded login pages
      # here and the portal serves them read-only as /custom.
      - ./campus/portal/custom:/app/api/storage/campus-portal-login
    depends_on:
      model-gateway:
        condition: service_healthy
    networks:
      - ssrf_proxy_network
      - default

  # The overlay owns the extra directory the API shares with the portal, so it
  # also keeps that directory writable by the API user.
  init_permissions:
    command:
      - sh
      - -c
      - |
        FLAG_FILE="/app/api/storage/.init_permissions"
        chown -R 1001:1001 /app/api/storage-portal-login 2>/dev/null || true
        if [ -f "$${FLAG_FILE}" ]; then
          echo "Permissions already initialized. Exiting."
          exit 0
        fi
        echo "Initializing permissions for /app/api/storage"
        chown -R 1001:1001 /app/api/storage && touch "$${FLAG_FILE}"
        echo "Permissions initialized. Exiting."
    volumes:
      - ./campus/portal/custom:/app/api/storage-portal-login

  api_websocket:
    image: *campus-dify-image
    build: *campus-dify-build
    # The base file only makes these wait for the database and for
    # init_permissions; none of them waits for `api`, which is the service that
    # runs the migrations. Depending on it being healthy means no worker starts
    # against a half-migrated schema — and it also drags `api` into the scope of
    # `up -d worker`, so the two cannot drift onto different images.
    depends_on:
      api:
        condition: service_healthy
    environment:
      MIGRATION_ENABLED: "false"
      SERVER_WORKER_AMOUNT: ${CAMPUS_API_WEBSOCKET_WORKER_AMOUNT:-2}
      SERVER_WORKER_CONNECTIONS: ${CAMPUS_API_WEBSOCKET_WORKER_CONNECTIONS:-1000}
      SQLALCHEMY_POOL_SIZE: ${CAMPUS_DB_POOL_SIZE:-20}
      SQLALCHEMY_MAX_OVERFLOW: ${CAMPUS_DB_MAX_OVERFLOW:-10}

  web:
    image: *campus-dify-web-image
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        COMMIT_SHA: ${CAMPUS_WEB_COMMIT_SHA:-campus}
        NPM_REGISTRY: ${CAMPUS_NPM_REGISTRY:-https://registry.npmmirror.com}

  worker:
    image: *campus-dify-image
    build: *campus-dify-build
    # See api_websocket: wait for the service that migrates the database.
    depends_on:
      api:
        condition: service_healthy
    environment:
      # The roster warm-up task provisions workspaces here, so this process
      # needs the same Campus configuration the api process has.
      <<: *campus-runtime-env
      CODE_EXECUTION_API_KEY: ${SANDBOX_API_KEY:?set SANDBOX_API_KEY}
      MIGRATION_ENABLED: "false"
      CELERY_WORKER_AMOUNT: ${CAMPUS_CELERY_WORKER_AMOUNT:-8}
      SQLALCHEMY_POOL_SIZE: ${CAMPUS_DB_POOL_SIZE:-20}
      SQLALCHEMY_MAX_OVERFLOW: ${CAMPUS_DB_MAX_OVERFLOW:-10}

  worker_beat:
    image: *campus-dify-image
    build: *campus-dify-build
    # See api_websocket: wait for the service that migrates the database.
    depends_on:
      api:
        condition: service_healthy
    environment:
      MIGRATION_ENABLED: "false"
      SQLALCHEMY_POOL_SIZE: ${CAMPUS_DB_POOL_SIZE:-20}
      SQLALCHEMY_MAX_OVERFLOW: ${CAMPUS_DB_MAX_OVERFLOW:-10}

  nginx:
    depends_on:
      portal:
        condition: service_healthy
    networks:
      - default
      - campus_portal
    ports: !override
      - "${CAMPUS_NGINX_BIND_ADDRESS:-127.0.0.1}:${EXPOSE_NGINX_PORT:-18080}:${NGINX_PORT:-80}"
      - "${CAMPUS_NGINX_BIND_ADDRESS:-127.0.0.1}:${EXPOSE_NGINX_SSL_PORT:-18443}:${NGINX_SSL_PORT:-443}"
      - "127.0.0.1:${CAMPUS_ADMIN_PORT:-18081}:8081"
      - "127.0.0.1:${CAMPUS_MANUAL_PUBLIC_PORT:-18083}:8082"
    volumes: !override
      - ./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./nginx/proxy.conf.template:/etc/nginx/proxy.conf.template:ro
      - ./nginx/https.conf.template:/etc/nginx/https.conf.template:ro
      - ./campus/nginx/default.conf.template:/etc/nginx/conf.d/default.conf.template:ro
      - ./campus/branding:/etc/nginx/campus-branding:ro
      - ./campus/admin/index.html:/campus-admin-html/index.html:ro
      - ./campus/admin/assets:/campus-admin-html/assets:ro
      - ./nginx/docker-entrypoint.sh:/docker-entrypoint-mount.sh:ro
      - ./nginx/ssl:/etc/ssl
      - ./volumes/certbot/conf/live:/etc/letsencrypt/live
      - ./volumes/certbot/conf:/etc/letsencrypt
      - ./volumes/certbot/www:/var/www/html

  portal:
    image: nginxinc/nginx-unprivileged@sha256:44e36330f74d4f3a1d4e222acca9e23b401fb87811a7597024502bb759c4dd49
    restart: always
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
      - /var/cache/nginx:size=16m,noexec,nosuid,nodev
      - /var/run:size=1m,noexec,nosuid,nodev
    volumes:
      - ./campus/portal/index.html:/usr/share/nginx/html/index.html:ro
      - ./campus/portal/assets:/usr/share/nginx/html/assets:ro
      - ./campus/portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # An administrator-uploaded login page; the Campus API writes it.
      - ./campus/portal/custom:/usr/share/nginx/html/custom:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - campus_portal

  plugin_daemon:
    ports: !override []
    networks:
      - ssrf_proxy_network
      - default
      - campus_gateway

  ssrf_proxy:
    environment:
      SSRF_PROXY_ALLOW_PRIVATE_DOMAINS: model-gateway
    networks:
      - ssrf_proxy_network
      - campus_gateway

  model-gateway:
    image: njit/model-gateway-campus:${CAMPUS_GATEWAY_IMAGE_TAG:-dev}
    build:
      context: ../../new-api-campus
      dockerfile: Dockerfile
      args:
        BUN_IMAGE: ${CAMPUS_GATEWAY_BUN_IMAGE:-oven/bun:1@sha256:0733e50325078969732ebe3b15ce4c4be5082f18c4ac1a0f0ca4839c2e4e42a7}
        GO_IMAGE: ${CAMPUS_GATEWAY_GO_IMAGE:-golang:1.26.1-alpine@sha256:2389ebfa5b7f43eeafbd6be0c3700cc46690ef842ad962f6c5bd6be49ed82039}
        RUNTIME_IMAGE: ${CAMPUS_GATEWAY_RUNTIME_IMAGE:-debian:bookworm-slim@sha256:f06537653ac770703bc45b4b113475bd402f451e85223f0f2837acbf89ab020a}
        GO_PROXY: ${CAMPUS_GATEWAY_GO_PROXY:-https://proxy.golang.org,direct}
    restart: always
    command: --log-dir /data/logs
    environment:
      SQL_DSN: ${CAMPUS_GATEWAY_DB_DSN:?set CAMPUS_GATEWAY_DB_DSN}
      REDIS_CONN_STRING: ${CAMPUS_GATEWAY_REDIS_CONN_STRING:?set CAMPUS_GATEWAY_REDIS_CONN_STRING}
      SESSION_SECRET: ${CAMPUS_GATEWAY_SESSION_SECRET:?set CAMPUS_GATEWAY_SESSION_SECRET}
      TZ: Asia/Shanghai
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "false"
      NODE_NAME: campus-model-gateway-1
    depends_on:
      model-gateway-db:
        condition: service_healthy
      model-gateway-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CAMPUS_GATEWAY_ADMIN_PORT:-13000}:3000"
    volumes:
      - campus_gateway_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -q '\"success\":true'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - campus_gateway

  model-gateway-db:
    image: postgres@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
    restart: always
    environment:
      POSTGRES_USER: ${CAMPUS_GATEWAY_DB_USER:?set CAMPUS_GATEWAY_DB_USER}
      POSTGRES_PASSWORD: ${CAMPUS_GATEWAY_DB_PASSWORD:?set CAMPUS_GATEWAY_DB_PASSWORD}
      POSTGRES_DB: ${CAMPUS_GATEWAY_DB_NAME:-campus_gateway}
    volumes:
      - campus_gateway_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - campus_gateway

  model-gateway-redis:
    image: redis@sha256:ec5e187c913d422cdf60f4216a5fdfb95246792c6de6fe21ff5bed75cbfc8c23
    restart: always
    command: ["redis-server", "--requirepass", "${CAMPUS_GATEWAY_REDIS_PASSWORD:?set CAMPUS_GATEWAY_REDIS_PASSWORD}"]
    environment:
      CAMPUS_GATEWAY_REDIS_PASSWORD: ${CAMPUS_GATEWAY_REDIS_PASSWORD:?set CAMPUS_GATEWAY_REDIS_PASSWORD}
    volumes:
      - campus_gateway_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$CAMPUS_GATEWAY_REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - campus_gateway

  weaviate:
    restart: always
    environment:
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY:?set WEAVIATE_API_KEY}

networks:
  campus_portal:
    driver: bridge
    internal: true
  campus_gateway:
    driver: bridge

# Gateway state is user data (per-student tokens, quota and billing), so it is
# bound to the bulk mechanical disk instead of Docker's data root on /.
volumes:
  campus_gateway_data:
    driver_opts:
      type: none
      o: bind
      device: /bak/dify-njit/gateway-data
  campus_gateway_postgres:
    driver_opts:
      type: none
      o: bind
      device: /bak/dify-njit/gateway-postgres
  campus_gateway_redis:
    driver_opts:
      type: none
      o: bind
      device: /bak/dify-njit/gateway-redis
